<style>
  :root {
    --space: #030a16;
    --hero: #ffffff;
    --hero-2: #c9d3e0;
    --hero-3: #8b98a6;
    --brand: #4f7cff;
    --brand-soft: #8fb0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--space);
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    color: var(--hero);
    overflow: hidden;
    position: relative;
  }
  /* Ana sayfadaki mavi isilti */
  .isilti {
    position: absolute; inset: 0;
    background:
      radial-gradient(38rem circle at 68% 44%, rgb(79 124 255 / 0.20), rgb(79 124 255 / 0.05) 42%, transparent 68%),
      radial-gradient(24rem circle at 8% 92%, rgb(79 124 255 / 0.10), transparent 62%);
  }
  .kadraj {
    position: relative;
    height: 100%;
    display: flex; align-items: center; justify-content: space-between;
    gap: 64px; padding: 0 76px;
  }
  .yazi { max-width: 600px; }
  .marka {
    font-family: Fraunces, Cambria, Georgia, serif;
    font-variation-settings: "opsz" 144;
    font-weight: 600;
    font-size: 94px; line-height: 1.0; letter-spacing: -0.018em;
  }
  .cizgi { width: 88px; height: 3px; border-radius: 2px; background: var(--brand); margin: 34px 0 32px; }
  .bolum { font-size: 34px; font-weight: 500; line-height: 1.25; color: var(--hero-2); }
  .okul { margin-top: 10px; font-size: 28px; font-weight: 400; line-height: 1.25; color: var(--hero-3); }
  .adres { margin-top: 38px; font-size: 27px; font-weight: 600; color: var(--brand-soft); letter-spacing: 0.005em; }
  .portre-kutu { position: relative; flex: 0 0 auto; }
  .portre-kutu::after {
    content: ""; position: absolute; inset: -34px;
    background: radial-gradient(closest-side, rgb(79 124 255 / 0.28), transparent 72%);
    z-index: 0;
  }
  .portre {
    position: relative; z-index: 1;
    width: 372px; height: 496px; object-fit: cover; object-position: 50% 22%;
    border-radius: 28px; border: 1px solid rgb(255 255 255 / 0.12);
  }
</style>
